# ==========================================================
# BIST Elite AI - Docker Compose
# ==========================================================
# Startup: docker compose up
# Stop:    docker compose down
# Reset:   docker compose down -v && docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: bist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bist_elite_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bist_elite_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bist-network

  redis:
    image: redis:7-alpine
    container_name: bist-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - bist-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bist-api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bist_elite_ai}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      PORT: 3001
      APP_NAME: ${APP_NAME:-BIST Elite AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      SCHEDULER_ENABLED: "false"
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query1.finance.yahoo.com/v8/finance/chart}
      YAHOO_FINANCE_TIMEOUT_MS: ${YAHOO_FINANCE_TIMEOUT_MS:-15000}
      FINTABLES_BASE_URL: ${FINTABLES_BASE_URL:-https://fintables.com/api/v1}
      FINTABLES_TIMEOUT_MS: ${FINTABLES_TIMEOUT_MS:-15000}
      FINTABLES_RETRY_ATTEMPTS: ${FINTABLES_RETRY_ATTEMPTS:-3}
      FINTABLES_RATE_LIMIT_RPS: ${FINTABLES_RATE_LIMIT_RPS:-5}
      HEALTH_MONITOR_ROLLING_WINDOW_MS: ${HEALTH_MONITOR_ROLLING_WINDOW_MS:-3600000}
      HEALTH_MONITOR_MAX_REQUEST_HISTORY: ${HEALTH_MONITOR_MAX_REQUEST_HISTORY:-1000}
      CURRENCY_RATE_USD: ${CURRENCY_RATE_USD:-32.5}
      CURRENCY_RATE_EUR: ${CURRENCY_RATE_EUR:-35.2}
      CURRENCY_RATE_GBP: ${CURRENCY_RATE_GBP:-41.3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - bist-network

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: bist-scheduler
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bist_elite_ai}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      APP_NAME: ${APP_NAME:-BIST Elite AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      SCHEDULER_ENABLED: "true"
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query1.finance.yahoo.com/v8/finance/chart}
      YAHOO_FINANCE_TIMEOUT_MS: ${YAHOO_FINANCE_TIMEOUT_MS:-15000}
      FINTABLES_BASE_URL: ${FINTABLES_BASE_URL:-https://fintables.com/api/v1}
      FINTABLES_TIMEOUT_MS: ${FINTABLES_TIMEOUT_MS:-15000}
      FINTABLES_RETRY_ATTEMPTS: ${FINTABLES_RETRY_ATTEMPTS:-3}
      FINTABLES_RATE_LIMIT_RPS: ${FINTABLES_RATE_LIMIT_RPS:-5}
      HEALTH_MONITOR_ROLLING_WINDOW_MS: ${HEALTH_MONITOR_ROLLING_WINDOW_MS:-3600000}
      HEALTH_MONITOR_MAX_REQUEST_HISTORY: ${HEALTH_MONITOR_MAX_REQUEST_HISTORY:-1000}
      CURRENCY_RATE_USD: ${CURRENCY_RATE_USD:-32.5}
      CURRENCY_RATE_EUR: ${CURRENCY_RATE_EUR:-35.2}
      CURRENCY_RATE_GBP: ${CURRENCY_RATE_GBP:-41.3}
      SCHEDULER_MARKET_OPEN_SCAN_INTERVAL: ${SCHEDULER_MARKET_OPEN_SCAN_INTERVAL:-900000}
      SCHEDULER_INCREMENTAL_SCAN_INTERVAL: ${SCHEDULER_INCREMENTAL_SCAN_INTERVAL:-3600000}
      SCHEDULER_PROVIDER_HEALTH_CHECK_INTERVAL: ${SCHEDULER_PROVIDER_HEALTH_CHECK_INTERVAL:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - bist-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bist-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bist-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bist-network:
    driver: bridge
