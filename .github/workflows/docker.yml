name: Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/bist-elite

jobs:
  # ==========================================================
  # Docker Build (PR validation)
  # ==========================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t bist-api:test .

      - name: Build Web image
        run: docker build -f docker/Dockerfile.web -t bist-web:test .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker -t bist-worker:test .

      - name: Test container startup
        run: |
          docker run -d --name test-api -p 3001:3001 bist-api:test
          sleep 5
          docker logs test-api
          docker stop test-api
          docker rm test-api

  # ==========================================================
  # Docker Build & Push (main branch)
  # ==========================================================
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            image: api
          - name: web
            dockerfile: docker/Dockerfile.web
            image: web
          - name: worker
            dockerfile: docker/Dockerfile.worker
            image: worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # Docker Compose Test
  # ==========================================================
  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for health checks
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          docker compose ps
          docker compose logs --tail=50

      - name: Test API endpoint
        run: |
          curl -f http://localhost:3001/health || echo "API not ready"

      - name: Stop services
        if: always()
        run: docker compose down -v
