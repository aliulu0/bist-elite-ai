name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}-api
  WEB_IMAGE: ${{ github.repository }}-web
  SCHEDULER_IMAGE: ${{ github.repository }}-scheduler

jobs:
  # ==========================================================
  # Build & Test
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bist-elite/database generate

      - name: Type check
        run: pnpm build -- --filter=@bist-elite/types

      - name: Build all
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --continue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/api/dist/
            apps/web/dist/
            packages/database/dist/
            packages/shared/dist/
          retention-days: 3

  # ==========================================================
  # Docker Build & Publish
  # ==========================================================
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api, web, scheduler]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env[format('{0}_IMAGE', matrix.service)] }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-and-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # Deploy to Cloud
  # ==========================================================
  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy (API)
        if: secrets.RENDER_DEPLOY_HOOK_API
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render Deploy (Web)
        if: secrets.RENDER_DEPLOY_HOOK_WEB
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"

      - name: Trigger Render Deploy (Scheduler)
        if: secrets.RENDER_DEPLOY_HOOK_SCHEDULER
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SCHEDULER }}"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker images published**: ghcr.io/${{ github.repository }}-*" >> $GITHUB_STEP_SUMMARY
