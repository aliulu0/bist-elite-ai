name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================================
  # Validate Release
  # ==========================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate CHANGELOG
        run: |
          if ! grep -q "$VERSION" CHANGELOG.md 2>/dev/null; then
            echo "Warning: Version $VERSION not found in CHANGELOG.md"
          fi

  # ==========================================================
  # Build & Test
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bist-elite/database generate

      - name: Build all
        run: pnpm build

      - name: Run all tests
        run: pnpm test

  # ==========================================================
  # Create GitHub Release
  # ==========================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "$PREV_TAG"..HEAD --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges -20)
          fi
          echo "## Changes" > release-notes.md
          echo "$COMMITS" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true

  # ==========================================================
  # Summary
  # ==========================================================
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [validate, build, release]
    steps:
      - name: Release complete
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: Released" >> $GITHUB_STEP_SUMMARY
